<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>AI Mafia Game - Enhanced</title>
  <meta name="viewport" content="width=device-width, initial-scale=1">

  <!-- Bootstrap -->
  <link
    href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
    rel="stylesheet"
  >
  
  <!-- Bootstrap Icons -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
  
  <style>
    body {
      background-color: #121212;
      color: #e0e0e0;
      font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    }
    
    .card {
      background-color: #1e1e1e;
      border: 1px solid #333;
      border-radius: 10px;
    }
    
    .card-header {
      background-color: #2d2d2d;
      border-bottom: 1px solid #444;
      font-weight: bold;
    }
    
    .list-group-item {
      background-color: #1e1e1e;
      border: none;
      color: #e0e0e0;
    }
    
    .log-box {
      height: 400px;
      overflow-y: auto;
      background-color: #0f0f0f;
      border-radius: 5px;
      padding: 10px;
      font-family: 'Courier New', monospace;
      font-size: 0.9em;
    }
    
    .log-entry {
      padding: 5px 0;
      border-bottom: 1px solid #333;
      color: #e0e0e0;
    }
    
    .log-entry:last-child {
      border-bottom: none;
    }
    
    .player-alive {
      color: #4CAF50;
    }
    
    .player-dead {
      color: #F44336;
    }
    
    .btn-primary {
      background-color: #4CAF50;
      border-color: #4CAF50;
    }
    
    .btn-danger {
      background-color: #F44336;
      border-color: #F44336;
    }
    
    .btn-info {
      background-color: #2196F3;
      border-color: #2196F3;
    }
    
    .btn-warning {
      background-color: #FF9800;
      border-color: #FF9800;
    }
    
    .role-badge {
      font-size: 0.8em;
    }
    
    .suspicion-meter {
      height: 10px;
      background-color: #333;
      border-radius: 5px;
      overflow: hidden;
      margin-top: 5px;
    }
    
    .suspicion-fill {
      height: 100%;
      background: linear-gradient(90deg, #F44336, #FF9800, #4CAF50);
      transition: width 0.3s ease;
    }
    
    .admin-panel {
      background-color: #1a1a1a;
      border: 1px solid #444;
      border-radius: 8px;
      padding: 15px;
      margin-top: 15px;
    }
    
    .status-indicator {
      width: 12px;
      height: 12px;
      border-radius: 50%;
      display: inline-block;
      margin-right: 8px;
    }
    
    .status-connected {
      background-color: #4CAF50;
    }
    
    .status-disconnected {
      background-color: #F44336;
    }
    
    .status-waiting {
      background-color: #FF9800;
    }
    
    .ai-status {
      display: inline-block;
      padding: 3px 8px;
      border-radius: 12px;
      font-size: 0.8em;
      margin-left: 5px;
    }
    
    .ai-active {
      background-color: #4CAF50;
      color: white;
    }
    
    .ai-inactive {
      background-color: #666;
      color: #ccc;
    }
    
    .game-stats {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(120px, 1fr));
      gap: 10px;
      margin: 15px 0;
    }
    
    .stat-box {
      background-color: #2d2d2d;
      padding: 10px;
      border-radius: 8px;
      text-align: center;
    }
    
    .stat-value {
      font-size: 1.5em;
      font-weight: bold;
      display: block;
    }
    
    .stat-label {
      font-size: 0.8em;
      color: #aaa;
    }
  </style>
</head>
<body class="bg-dark text-light">

<nav class="navbar navbar-dark bg-black px-3">
  <div class="container-fluid">
    <span class="navbar-brand">
      <i class="bi bi-robot"></i> AI Mafia Game
    </span>
    <div class="d-flex align-items-center">
      <span id="gameStatus" class="badge bg-secondary me-2">Waiting</span>
      <span id="aiStatus" class="ai-status ai-inactive">AI: Offline</span>
    </div>
  </div>
</nav>

<div class="container-fluid mt-3">
  <div class="row g-3">

    <div class="col-md-3">
      <div class="card h-100">
        <div class="card-header d-flex justify-content-between align-items-center">
          <span>Players</span>
          <button class="btn btn-sm btn-info" id="toggleRolesBtn">
            <i class="bi bi-eye"></i> Show Roles
          </button>
        </div>
        <div class="card-body">
          <div class="game-stats">
            <div class="stat-box">
              <span class="stat-value" id="playersAlive">6</span>
              <span class="stat-label">Alive</span>
            </div>
            <div class="stat-box">
              <span class="stat-value" id="roundNumber">1</span>
              <span class="stat-label">Round</span>
            </div>
            <div class="stat-box">
              <span class="stat-value" id="mafiaCount">1</span>
              <span class="stat-label">Mafia</span>
            </div>
            <div class="stat-box">
              <span class="stat-value" id="civilianCount">5</span>
              <span class="stat-label">Civilians</span>
            </div>
          </div>
        </div>
        <ul class="list-group list-group-flush" id="players">
          <!-- Players will be added here by JavaScript -->
        </ul>
      </div>
    </div>

    <div class="col-md-9">
      <div class="card">
        <div class="card-header d-flex justify-content-between">
          <span>Live Game Log</span>
          <div>
            <button class="btn btn-success btn-sm me-2" onclick="startGame()">
              <i class="bi bi-play-circle"></i> Start
            </button>
            <button class="btn btn-warning btn-sm me-2" onclick="pauseGame()">
              <i class="bi bi-pause-circle"></i> Pause
            </button>
            <button class="btn btn-info btn-sm me-2" onclick="stepGame()">
              <i class="bi bi-step-forward"></i> Step
            </button>
            <button class="btn btn-danger btn-sm" onclick="resetGame()">
              <i class="bi bi-arrow-clockwise"></i> Reset
            </button>
          </div>
        </div>

        <div id="logBox" class="card-body log-box"></div>
      </div>
      
      <!-- Admin Panel -->
      <div class="admin-panel">
        <h5 class="mb-3">
          <i class="bi bi-gear"></i> Admin Controls
        </h5>
        
        <div class="row g-2 mb-3">
          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select bg-dark text-light" id="gameSpeed">
                <option value="0.5">0.5x (Slow)</option>
                <option value="1.0" selected>1.0x (Normal)</option>
                <option value="1.5">1.5x (Fast)</option>
                <option value="2.0">2.0x (Very Fast)</option>
              </select>
              <label for="gameSpeed">Game Speed</label>
            </div>
          </div>
          <div class="col-md-6">
            <div class="form-floating">
              <select class="form-select bg-dark text-light" id="maxRounds">
                <option value="5">5 Rounds</option>
                <option value="10" selected>10 Rounds</option>
                <option value="15">15 Rounds</option>
                <option value="20">20 Rounds</option>
              </select>
              <label for="maxRounds">Max Rounds</label>
            </div>
          </div>
        </div>
        
        <button class="btn btn-primary btn-sm me-2" onclick="applySettings()">
          <i class="bi bi-check"></i> Apply Settings
        </button>
        
        <button class="btn btn-info btn-sm me-2" onclick="showGameSummary()">
          <i class="bi bi-graph-up"></i> Game Summary
        </button>
        
        <button class="btn btn-warning btn-sm" onclick="showPlayerRoles()">
          <i class="bi bi-person-lines-fill"></i> Reveal Roles
        </button>
        
        <div class="mt-3">
          <h6>AI Provider Status:</h6>
          <div id="aiProviderStatus" class="row g-2 mt-2">
            <!-- AI status will be added here by JavaScript -->
          </div>
        </div>
      </div>
    </div>

  </div>
</div>

<!-- Game Summary Modal -->
<div class="modal fade" id="gameSummaryModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog modal-lg">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title">Game Summary</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="gameSummaryContent">
        <!-- Game summary will be added here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<!-- Player Roles Modal -->
<div class="modal fade" id="playerRolesModal" tabindex="-1" aria-hidden="true">
  <div class="modal-dialog">
    <div class="modal-content bg-dark text-light">
      <div class="modal-header">
        <h5 class="modal-title">Player Roles (Admin View)</h5>
        <button type="button" class="btn-close btn-close-white" data-bs-dismiss="modal" aria-label="Close"></button>
      </div>
      <div class="modal-body" id="playerRolesContent">
        <!-- Player roles will be added here -->
      </div>
      <div class="modal-footer">
        <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Close</button>
      </div>
    </div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="app.js"></script>
</body>
</html>
